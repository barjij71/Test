name: jarvis-integration

on:
  push:
    branches:
      - 'jarvis/**'
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-integration.yml'

permissions:
  contents: read
  actions: read
  checks: write

env:
  NODE_VERSION: "22"

jobs:
  mcp-mock-tests:
    name: MCP Mock Server Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis/package-lock.json

      - name: Install dependencies
        run: npm ci

