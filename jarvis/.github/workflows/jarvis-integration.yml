  summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [mcp-mock-tests, telegram-mock-tests, hermes-sync-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Report Status
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Phase |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|-------|" >> $GITHUB_STEP_SUMMARY
