name: jarvis-emulator

on:
  workflow_dispatch:
  push:
    branches:
      - 'jarvis/**'
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-emulator.yml'

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"
  RUST_VERSION: "stable"
  JDK_VERSION: "17"
  NDK_VERSION: "27.0.12077973"

jobs:
  emulator-smoke:
    name: Emulator Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: ${{ env.NDK_VERSION }}
          emulator: true
          arch: x86_64

      - name: Install dependencies
        run: npm ci

      - name: Build Debug APK (x86_64)
        run: |
          npm run tauri android build --debug --apk --target x86_64
          # Alternative:
          # cd src-tauri && cargo tauri android build --debug --apk --target x86_64-linux-android

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*x86_64*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Start Emulator
        run: |
          emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          android-wait-for-emulator
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install APK
        run: |
          adb install -r ${{ steps.find-apk.outputs.apk_path }}

      - name: Run Smoke Tests
        run: |
          # Basic smoke tests
          adb shell am start -n com.jarvis.app/.MainActivity
          sleep 5
          
          # Check app launched
          adb shell pidof com.jarvis.app
          
          # Run any available UI tests
          # adb shell am instrument -w -r com.jarvis.app.test/androidx.test.runner.AndroidJUnitRunner
          
          echo "Basic smoke test passed - app launches"

      - name: Collect Logs
        if: always()
        run: |
          adb logcat -d > emulator_logcat.txt || true
          
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: emulator_logcat.txt
          retention-days: 7

  summary:
    name: Emulator Summary
    runs-on: ubuntu-latest
    needs: [emulator-smoke]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Report Status
        run: |
          echo "## Emulator Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Emulator Smoke | ${{ needs.emulator-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.emulator-smoke.result }}" = "success" ]; then
            echo "✅ Emulator tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Emulator tests failed" >> $GITHUB_STEP_SUMMARY
          fi